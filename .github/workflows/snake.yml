name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
      - ".github/scripts/snakeify.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: uditstocks
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Swap the snake for a pixel-art Michael Scott: slower, and he stops for
      # two seconds whenever a speech bubble shows.
      - name: Michael-ify the snake
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          ls -la dist
          python3 .github/scripts/snakeify.py dist/github-snake.svg dist/github-snake-dark.svg --slow 1.5 --pause 2000

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
